name: Entregar atualização para cPanel
on:
  push:
    branches: [main]
    paths:
      - 'cpanel/site/**'
      - 'cpanel/release-*.zip.base64'
      - '.github/workflows/entregar-atualizacao-cpanel.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: radio-gospel-cpanel-update
  cancel-in-progress: false
jobs:
  prepare-and-deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar e preparar a versão PHP do portal
        run: |
          python3 - <<'PY'
          import base64, pathlib, zipfile, os
          src=pathlib.Path('cpanel/release-v3.1.zip.base64')
          if not src.is_file(): raise SystemExit('Pacote PHP não disponível')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'radio-cpanel-update.zip'
          target.write_bytes(base64.b64decode(src.read_text().strip(),validate=True))
          with zipfile.ZipFile(target) as z:
            if z.testzip(): raise SystemExit('Pacote ZIP inválido')
            if not any(n.endswith('.php') for n in z.namelist()): raise SystemExit('Pacote vazio')
            for n in z.namelist():
              parts=n.split('/')
              if n.startswith('/') or '..' in parts or n.startswith('data/') or n=='update-receiver.php' or any(p.startswith('.') for p in parts):
                raise SystemExit('Nome de arquivo inseguro')
          PY
      - name: Autenticar entrega com identidade assinada do GitHub
        env:
          AUDIENCE: https://alternativagospel.com.br/update-receiver.php
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/oidc-token"
          import json, os, urllib.parse, urllib.request
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          sep='&' if '?' in url else '?'
          url+=sep+urllib.parse.urlencode({'audience':os.environ['AUDIENCE']})
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request,timeout=15) as res:
              print(json.load(res)['value'])
          PY
          chmod 600 "$RUNNER_TEMP/oidc-token"
      - name: Enviar versão autenticada para hospedagem
        run: |
          curl --fail-with-body --show-error --silent --retry 2 --max-time 90 \
            -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc-token")" \
            -F "sha=$GITHUB_SHA" \
            -F "package=@$RUNNER_TEMP/radio-cpanel-update.zip;type=application/zip" \
            https://alternativagospel.com.br/update-receiver.php
